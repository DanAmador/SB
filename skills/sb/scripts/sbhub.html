<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>sb hub</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1c1c1a;--mute:#6a6964;--line:#e4e2da;--ok:#2e7d4f;--warn:#8a5a00;--warnbg:#fff4dc;--bad:#b3261e;--acc:#3b5bdb;--onacc:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--card:#1f1f1d;--ink:#ecebe6;--mute:#a3a198;--line:#34342f;--ok:#5fbf85;--warn:#e8b85a;--warnbg:#3a2e12;--bad:#ef7a6b;--acc:#8ea2ff;--onacc:#10131f}}
*{box-sizing:border-box}body{margin:0 auto;background:var(--bg);color:var(--ink);font:14px/1.35 -apple-system,system-ui,sans-serif;padding:12px 16px;max-width:1100px}
h1{font-size:15px;margin:0 0 8px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}#sum{font-weight:400;color:var(--mute);font-size:12px}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:14px 0 4px}
.mute{color:var(--mute);font-size:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
.box>*+*{border-top:1px solid var(--line)}
.banner{background:var(--warnbg);color:var(--warn);border:1px solid var(--warn);border-radius:8px;padding:8px 12px;margin:0 0 8px;font-weight:600}
body.down main{opacity:.6}
.clear{margin:10px 0;padding:8px 12px;border-radius:8px;background:var(--card);border:1px solid var(--line);color:var(--ok)}
.empty{padding:12px;color:var(--mute)}
.ic{flex:none;width:20px;text-align:center;font-size:15px;line-height:20px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.sw{font-size:11px;color:var(--mute);white-space:nowrap}
/* a session: icon | stacked lines | age; long text wraps on words, breaks unbroken strings, and is capped */
.ses{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:0 8px;padding:7px 10px;align-items:start}
.ses .lead{display:flex;flex-direction:column;align-items:center}
.main{min-width:0;display:grid;grid-template-columns:minmax(0,1fr);gap:1px}
.t{font-weight:600;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ask,.l3{font-size:12.5px;color:var(--mute)}
.l2{display:flex;flex-wrap:wrap;gap:1px 6px;align-items:center;font-size:12px;color:var(--mute);min-width:0}
.l2>*{max-width:100%;min-width:0}.pj{max-width:18ch}.tk{max-width:28ch}
.age{font-size:12px;color:var(--mute);white-space:nowrap}
.calm .t{color:var(--mute);font-weight:500}
.kids{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px;min-width:0}
.chip{font-size:12px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:inline-block}
.kids .chip{max-width:16ch}
.chip.bad{border-color:var(--bad);color:var(--bad)}.chip.ok{color:var(--ok)}
.chip.warn{border-color:var(--warn);color:var(--warn);background:var(--warnbg);font-weight:600}
.pips{display:inline-flex;gap:2px;align-items:center;vertical-align:middle}
.pips i{width:7px;height:11px;border-radius:2px;border:1.5px solid var(--mute)}
.pips i.on{background:var(--ok);border-color:var(--ok)}
.pips i.now{height:15px;border:2.5px solid var(--acc)}
.bar{display:inline-block;width:56px;height:7px;border-radius:4px;background:var(--line);overflow:hidden;vertical-align:middle}.bar i{display:block;height:100%;background:var(--ok)}
/* questions */
.q{border-color:var(--acc)}
.qr{padding:8px 10px}
.qh{display:flex;gap:8px;align-items:flex-start}.qt{min-width:0;flex:1}
.qq{overflow-wrap:anywhere;margin-top:1px}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0 28px;align-items:stretch}
button{font:inherit;font-size:13px;padding:5px 12px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;max-width:100%;white-space:normal;text-align:left;overflow-wrap:anywhere;min-height:32px}
button.def{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
button small{font-size:11px;opacity:.9}
button:disabled{cursor:default;opacity:.55}
button.chosen{opacity:1;outline:2px solid var(--ok);outline-offset:1px}
button:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.qs{margin:4px 0 0 28px;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--mute)}
.qs .soon{color:var(--warn);font-weight:600}.err{color:var(--bad);font-weight:600}
.settled .qq{color:var(--mute)}
/* projects */
details>summary{cursor:pointer;list-style:none;padding:7px 10px;display:flex;flex-wrap:wrap;gap:3px 8px;align-items:center;min-width:0}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"\25b8";color:var(--mute);font-size:11px}details[open]>summary::before{content:"\25be"}
.pn{font-weight:600;overflow-wrap:anywhere}.phd{padding:7px 10px 7px 26px;display:flex;flex-wrap:wrap;gap:3px 8px;align-items:center}
.pl{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding:4px 10px 4px 30px;font-size:12px}
details details>summary{padding:2px 10px 2px 30px;font-size:12px;color:var(--mute)}
pre{margin:0;padding:0 10px 6px 30px;font:11px/1.4 ui-monospace,monospace;color:var(--mute);white-space:pre-wrap;overflow-wrap:anywhere}
.lr{display:flex;gap:8px;align-items:flex-start;padding:6px 10px}.lr .lm{flex:1;min-width:0}
.lr .chip{max-width:40%}
@media(max-width:599px){
  body{padding:10px}.sw{display:none}
  .opts{margin-left:0}.opts button{flex:1 1 100%;min-height:42px;padding:4px 12px}.qs{margin-left:0}
  /* line 1 is icon, title, age; every later line uses the full width */
  .main{display:contents}.ses{gap:1px 8px}.ses .lead{grid-row:1/span 6}
  .main>*{grid-column:2/4}.main .l1{grid-column:2}.ses .age{grid-column:3;grid-row:1}
  .kids .chip{max-width:13ch;font-size:11.5px;padding:0 6px}
  .tk{max-width:14ch}.pips i{width:5px}.l2{gap:1px 4px}
}
@media(min-width:760px){
  .main{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:1px 14px}
  .main .l1{grid-column:1;grid-row:1}.main .ask{grid-column:1;grid-row:2}
  .main .l2{grid-column:2;grid-row:1}.main .l3{grid-column:2;grid-row:2}
  .main .kids{grid-column:1/3}
  .t{-webkit-line-clamp:1;line-clamp:1}
}
</style>
<header><h1>sb hub <span id="sum"></span></h1>
<div id="banner" class="banner" role="alert" hidden></div></header>
<main id="app"></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>Number.isFinite(+n)?+n:0;
const own=(o,k)=>o&&typeof o=='object'&&typeof k=='string'&&Object.prototype.hasOwnProperty.call(o,k)?o[k]:undefined;
const dur=s=>{s=Math.max(0,Math.floor(s));return s<60?s+'s':s<3600?Math.floor(s/60)+'m':s<86400?Math.floor(s/3600)+'h':Math.floor(s/86400)+'d'};
const ago=(now,t)=>dur(now-num(t))+' ago';
const plural=(n,w,ws)=>n+' '+(n==1?w:ws||w+'s');
const short=id=>String(id??'').slice(0,6);
const proj=p=>String(p||'').split('/').filter(Boolean).pop()||'';
const clock=ms=>new Date(ms).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
// state: [glyph, word]; a needs-you bell and a your-turn speech bubble do not read as the same thing
const ST={working:['⏳','working'],done:['✅','done'],blocked:['⛔','blocked'],'needs you':['🔔','needs you'],'your turn':['💬','your turn'],waiting:['⏸️','waiting'],idle:['💤','idle']};
const RANK={'needs you':0,blocked:0,'your turn':1,working:2,waiting:2,idle:3,done:4};
const rank=a=>own(RANK,a.state)??2;
const TOOL={Bash:'⌨️',run_command:'⌨️',Read:'📄',read_file:'📄',view_file:'📄',Edit:'✏️',edit_file:'✏️',Write:'✏️',write_file:'✏️',Grep:'🔎',grep_search:'🔎',Glob:'🔎',Agent:'🤖',Task:'🤖',invoke_subagent:'🤖',WebFetch:'🌐',WebSearch:'🌐',search_web:'🌐'};
const LV={ok:'🟢',warn:'🟡',bad:'🔴'};
const PICON={git:'🌿',tests:'🧪',unity:'🎮',build:'🔨',server:'🖥️'},WRENCH='🔧';
const act=a=>{const m=/^(\w+)(?:: ?(.*))?$/.exec(a.note||'');return m&&own(TOOL,m[1])?[TOOL[m[1]],m[2]||m[1]]:['',a.note||'']};
const tnum=t=>/^\d+$/.test(String(t))?'ticket '+t:String(t);
// one label for an agent everywhere: title, else ticket, else name, else a short id (raw text: esc it where it is used)
const lbl=a=>String(a.title||(a.ticket?tnum(a.ticket):'')||a.name||short(a.agent));
let S=null,gotAt=0,okAt=0,downSince=0,last='',lastAt=0;const fails={};
const agentOf=id=>{if(!S||typeof id!='string')return null;return own(S.agents,own(S.aliases,id)||id)||null};
const who=id=>{const a=agentOf(id);return a?lbl(a):short(id)};
const whereOf=id=>{const a=agentOf(id);return a?proj(a.project):''};
const stIc=st=>{const [g,w]=own(ST,st)||['•',String(st||'unknown')];return `<span class="ic" role="img" aria-label="${esc(w)}" title="${esc(w)}">${g}</span>`};
const stWord=st=>{const v=own(ST,st);return `<span class="sw" aria-hidden="true">${esc(v?v[1]:st||'')}</span>`};
function prog(d,t){const label=`${d} of ${t} tickets done`;
  if(t>20){const pc=Math.max(0,Math.min(100,100*d/t));return `<span title="${esc(label)}"><span class="bar"><i style="width:${pc}%"></i></span> ${d}/${t}</span>`}
  let h='';for(let i=0;i<t;i++)h+=`<i class="${i<d?'on':i==d?'now':''}"></i>`;
  return `<span title="${esc(label)}"><span class="pips" role="img" aria-label="${esc(label)}">${h}</span> ${d}/${t}</span>`}
function chip(s,a){const [ic]=act(a),[g,w]=own(ST,a.state)||['•',String(a.state||'')],c=rank(a)==0?'bad':a.state=='done'?'ok':'';
  return `<span class="chip ${c}" dir="auto" title="${esc(lbl(a))} · ${esc(w)} · ${esc(a.note)} · active ${esc(ago(s.now,a.at))}"><span role="img" aria-label="${esc(w)}">${g}</span> ${esc(lbl(a))}${ic?' '+ic:''}</span>`}
function sess(s,a,kids,inProj){
  const [ti,txt]=act(a),t=num(a.total),d=num(a.done),silent=s.now-num(a.at),quiet=a.state=='working'&&silent>=600,name=lbl(a),pn=proj(a.project),meta=[];
  if(pn&&!inProj)meta.push(`<span class="pj one" title="${esc(a.project)}">${esc(pn)}</span>`);
  if(a.ticket&&a.role!='worker'&&tnum(a.ticket)!==name)meta.push(`<span class="tk one" dir="auto" title="ticket: ${esc(a.ticket)}">🎫 ${esc(tnum(a.ticket))}</span>`);
  if(t>0)meta.push(prog(d,t));
  if(a.state=='working'&&num(a.since))meta.push(`<span>working ${esc(dur(s.now-num(a.since)))}</span>`);
  if(quiet)meta.push(`<span class="chip warn">⚠ quiet for ${esc(dur(silent))}</span>`);
  return `<div class="ses${a.state=='idle'||a.state=='done'?' calm':''}"><span class="lead">${stIc(a.state)}${stWord(a.state)}</span><div class="main">`
    +`<div class="l1"><span class="t" dir="auto" title="${esc(name)}">${esc(name)}</span></div>`
    +(a.asked?`<div class="ask one" dir="auto" title="${esc(a.asked)}">You asked: “${esc(a.asked)}”</div>`:'')
    +(meta.length?`<div class="l2">${meta.join('<span aria-hidden="true">·</span>')}</div>`:'')
    +(txt?`<div class="l3 one" dir="auto" title="${esc(txt)}">${ti} ${esc(txt)}</div>`:'')
    +(kids.length?`<div class="kids">${kids.map(k=>chip(s,k)).join('')}</div>`:'')
    +`</div><span class="age">active ${esc(ago(s.now,a.at))}</span></div>`}
function qrow(s,id,q){
  const decided=q.answer!=null,left=num(q.deadline)-s.now,pending=!decided&&left<=0,off=decided||pending||!!downSince,pn=whereOf(q.agent);
  const btn=(o,i)=>`<button data-q="${esc(id)}" data-i="${i}" data-key="${esc('q:'+id+':'+i)}" class="${o==q.default?'def':''}${decided&&o==q.answer?' chosen':''}"${off?' disabled':''} dir="auto">${decided&&o==q.answer?'✓ ':''}${esc(o)}${o==q.default?'<small> · default</small>':''}</button>`;
  const status=decided?`<span>${q.by=='default'?'Default applied':q.by=='you'?'You chose this':'Chosen by '+esc(q.by)} · moving to the log</span>`
    :pending?'<span class="soon">deciding…</span>'
    :`<span class="cd${left<60?' soon':''}" data-dl="${num(q.deadline)}" title="the default applies then">⏱ ${esc(dur(left))} left</span>`;
  return `<div class="qr${decided?' settled':''}" data-qr="${esc(id)}"><div class="qh">${'<span class="ic" role="img" aria-label="question">❓</span>'}<div class="qt">`
    +`<div class="mute one"><b dir="auto">${esc(who(q.agent))}</b>${pn?' · '+esc(pn):''} · asked ${esc(ago(s.now,q.asked))}</div>`
    +`<div class="qq" dir="auto">${esc(q.q)}</div></div></div>`
    +`<div class="opts">${(Array.isArray(q.options)?q.options:[]).map(btn).join('')}</div>`
    +`<div class="qs">${status}${!decided&&own(fails,id)?`<span class="err" role="alert">Not sent: ${esc(fails[id])}</span>`:''}</div></div>`}
function widget(w){
  const label=esc(w.label);
  if(w.kind=='status')return `<span class="chip" title="${label}">${own(LV,w.level)||''} ${esc(String(w.value).slice(0,40))}</span>`;
  if(w.kind=='progress'){const v=num(w.value),m=num(w.max),pc=Math.max(0,Math.min(100,100*v/(m||1)));
    return `<span class="bar" title="${label} ${v}/${m}"><i style="width:${pc}%"></i></span><span class="mute">${v}/${m}</span>`}
  if(w.kind=='counts'&&w.items&&typeof w.items=='object')return Object.entries(w.items).map(([k,v])=>`<span class="chip ${k=='fail'&&num(v)?'bad':''}" title="${label}">${k=='pass'?'✅':k=='fail'?'❌':esc(k)} ${esc(v)}</span>`).join('');
  return '';
}
const wlist=p=>Array.isArray(p.widgets)?p.widgets.filter(w=>w&&typeof w=='object'):[];
// the folded line on a project header: branch, uncommitted count, test results, anything not ok
function digest(list){let h='';
  for(const p of list)for(const w of wlist(p)){
    if(w.kind=='status'&&w.label=='Branch')h+=`<span class="chip" title="branch">🌿 ${esc(String(w.value).slice(0,30))}</span>`;
    else if(w.kind=='status'&&w.label=='Uncommitted files')h+=`<span class="chip${num(w.value)?' warn':''}" title="uncommitted files">${esc(w.value)} uncommitted</span>`;
    else if(w.kind=='counts')h+=widget(w);
    else if(w.kind=='status'&&(w.level=='bad'||w.level=='warn'))h+=`<span class="chip ${w.level=='bad'?'bad':''}" title="${esc(p.title)}">${own(LV,w.level)} ${esc(w.label)}</span>`;}
  return h}
function provider(p,path){const ws=wlist(p),logs=ws.filter(w=>w.kind=='log'&&Array.isArray(w.lines));
  return `<div class="pl"><span class="ic" role="img" aria-label="${esc(p.title)}" title="${esc(p.title)}">${own(PICON,p.icon)||WRENCH}</span><span class="mute">${esc(p.title)}</span>${ws.map(widget).join('')}</div>`
    +logs.map(l=>{const k=path+'|'+p.title+'|'+l.label;return `<details data-k="${esc(k)}"><summary data-key="${esc('d:'+k)}">${esc(l.label)}</summary><pre>${l.lines.map(esc).join('\n')}</pre></details>`}).join('')}
async function answer(qid,i){const q=S&&own(S.questions,qid);if(!q||!Array.isArray(q.options)||i>=q.options.length||q.answer!=null)return;
  delete fails[qid];let ok=false,why='hub not reachable';
  if(!downSince)try{const r=await fetch('/api/answer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({qid,answer:q.options[i]})});
    ok=r.ok;if(!ok){const j=await r.json().catch(()=>({}));why=j.error||'the hub said '+r.status}}catch(e){}
  if(!ok){fails[qid]=why;render(S)}
  tick(true)}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-q]');if(b&&!b.disabled)answer(b.dataset.q,+b.dataset.i)});
function render(s){
  const agents=Object.values(s.agents||{}),qs=Object.entries(s.questions||{}),locks=Object.entries(s.locks||{}),provs=s.providers||{};
  const par=a=>{const p=own(s.agents,a.parent);return p&&p.role!='worker'?p:null};
  const order=(x,y)=>rank(x)-rank(y)||num(y.at)-num(x.at);
  const tops=agents.filter(a=>a.role!='worker'||!par(a)).sort(order),kids=p=>agents.filter(a=>a.role=='worker'&&par(a)===p).sort(order);
  const open=qs.filter(([,q])=>q.answer==null).sort((x,y)=>num(x[1].deadline)-num(y[1].deadline));
  const recent=qs.filter(([,q])=>q.answer!=null&&s.now-num(q.answered)<20);
  const need=tops.filter(a=>rank(a)==0),wait=tops.filter(a=>a.state=='your turn'),rest=tops.filter(a=>rank(a)>1);
  const bad=[];for(const [path,list] of Object.entries(provs))for(const p of Array.isArray(list)?list:[])for(const w of wlist(p))if(w.level=='bad')bad.push([path,p,w]);
  const alerts=open.length+need.length+bad.length;
  document.getElementById('sum').textContent=[plural(tops.length,'session'),plural(agents.length-tops.length,'worker'),alerts+' need you',wait.length+' waiting for you',plural(locks.length,'lock')].join(' · ');
  document.title=(alerts?`(${alerts}) `:'')+'sb hub';
  let h='';
  if(alerts||recent.length)h+='<h2>Needs you</h2><div class="box q">'+open.concat(recent).sort((x,y)=>num(x[1].deadline)-num(y[1].deadline)).map(([id,q])=>qrow(s,id,q)).join('')+need.map(a=>sess(s,a,kids(a))).join('')
    +bad.map(([path,p,w])=>`<div class="lr"><span class="ic" role="img" aria-label="problem">🔴</span><div class="lm"><b>${esc(proj(path))}</b> · ${esc(p.title)}: ${esc(w.label)} <span class="mute">${esc(String(w.value).slice(0,120))}</span></div></div>`).join('')+'</div>';
  if(!alerts)h+='<p class="clear">✓ Nothing needs you</p>';
  if(wait.length)h+=`<h2>Waiting for you</h2><div class="box">`+wait.map(a=>sess(s,a,kids(a))).join('')+'</div>';
  const groups=new Map();for(const p of Object.keys(provs))groups.set(p,[]);
  for(const a of rest){const k=typeof a.project=='string'?a.project:'';if(!groups.has(k))groups.set(k,[]);groups.get(k).push(a)}
  const best=l=>l.length?[rank(l[0]),-num(l[0].at)]:[9,0];
  const gs=[...groups].sort((x,y)=>{const a=best(x[1]),b=best(y[1]);return a[0]-b[0]||a[1]-b[1]||x[0].localeCompare(y[0])});
  if(gs.length)h+='<h2>Sessions by project</h2>';
  for(const [path,list] of gs){const pl=Array.isArray(own(provs,path))?provs[path]:[],k='p:'+path,others=tops.filter(a=>a.project===path).length-list.length;
    const head=`<span class="pn" dir="auto">${esc(proj(path)||'No project')}</span><span class="mute">${esc(list.length?plural(list.length,'session')+(others>0?` (+${others} above)`:''):others>0?others+' above':'no sessions')}</span>${digest(pl)}`;
    h+='<section class="box">'+(pl.length?`<details data-k="${esc(k)}"><summary data-key="${esc('d:'+k)}">${head}</summary>${pl.map(p=>provider(p,path)).join('')}</details>`:`<div class="phd">${head}</div>`)
      +list.map(a=>sess(s,a,kids(a),true)).join('')+'</section>'}
  if(!tops.length)h+='<div class="box"><div class="empty">No sessions yet. A Claude Code session with the hub-report mod shows here once it starts.</div></div>';
  const dec=qs.filter(([,q])=>q.answer!=null).sort((x,y)=>num(y[1].answered)-num(x[1].answered)).slice(0,8);
  if(dec.length||locks.length)h+='<h2>Log</h2><div class="box">'
    +locks.map(([k,l])=>`<div class="lr"><span class="ic" role="img" aria-label="lock">🔒</span><div class="lm one" dir="auto">${esc(k)}</div><span class="mute">held by ${esc(who(l.by))} · ${esc(ago(s.now,l.at))}</span></div>`).join('')
    +dec.map(([,q])=>{const pn=whereOf(q.agent),by=q.by=='default'?'Default applied':q.by=='you'?'Chosen by you':'Chosen by '+q.by;
      return `<div class="lr"><span class="ic" role="img" aria-label="${esc(by)}">${q.by=='default'?'⏱':'✓'}</span><div class="lm"><div class="one" dir="auto" title="${esc(q.q)}">${esc(q.q)}</div><div class="mute one">${esc(by)} · ${esc(who(q.agent))}${pn?' · '+esc(pn):''} · ${esc(ago(s.now,q.answered))}</div></div><span class="chip ok" dir="auto" title="${esc(q.answer)}">${esc(q.answer)}</span></div>`}).join('')+'</div>';
  // keep what the owner had open, focused and scrolled to across the rewrite
  const app=document.getElementById('app'),kept=new Set([...app.querySelectorAll('details[open]')].map(d=>d.dataset.k));
  const ae=document.activeElement,fk=ae&&app.contains(ae)&&ae.dataset?ae.dataset.key:null,y=window.scrollY;
  app.innerHTML=h;
  app.querySelectorAll('details').forEach(d=>{if(kept.has(d.dataset.k))d.open=true});
  if(fk){const el=app.querySelector(`[data-key="${CSS.escape(fk)}"]`);if(el&&!el.disabled)el.focus({preventScroll:true})}
  if(window.scrollY!==y)window.scrollTo(0,y);
}
function setDown(on){const b=document.getElementById('banner');document.body.classList.toggle('down',on);b.hidden=!on;
  b.textContent=on?(okAt?`Hub not reachable — showing the last state from ${clock(okAt)}`:'Hub not reachable — no state yet'):'';
  document.querySelectorAll('#app button[data-q]').forEach(x=>{if(on)x.disabled=true})}
async function tick(force){
  let s;
  try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw new Error(r.status);s=await r.json()}
  catch(e){if(!downSince){downSince=Date.now();setDown(true)}return}
  if(downSince){downSince=0;setDown(false);force=true}
  S=s;gotAt=okAt=Date.now();const {now,...rest}=s,key=JSON.stringify(rest);
  if(force!==true&&key===last&&Date.now()-lastAt<10000)return;
  last=key;lastAt=Date.now();render(s);
}
// countdowns move every second between renders; under a minute they count seconds
setInterval(()=>{if(!S||downSince)return;const est=S.now+(Date.now()-gotAt)/1000;
  document.querySelectorAll('#app .cd[data-dl]').forEach(el=>{const left=num(el.dataset.dl)-est;
    if(left>0){el.textContent='⏱ '+dur(left)+' left';el.classList.toggle('soon',left<60)}
    else{el.textContent='deciding…';el.removeAttribute('data-dl');el.classList.add('soon');
      const r=el.closest('[data-qr]');if(r)r.querySelectorAll('button').forEach(b=>b.disabled=true)}})},1000);
tick();setInterval(tick,2000);
</script>
