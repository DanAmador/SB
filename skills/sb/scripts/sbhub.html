<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>sb hub</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#18181a;--mute:#66666c;--line:#e5e4df;--hover:#f2f1ed;--acc:#3451d1;--accbg:#edf0fc;--onacc:#fff;
  --ok:#23824f;--warn:#8a5a00;--warnbg:#fff4dc;--bad:#b3261e;--badbg:#fdecea;--r:8px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace}
@media(prefers-color-scheme:dark){:root{--bg:#121213;--panel:#1a1a1c;--ink:#ececec;--mute:#9d9da3;--line:#2c2c2f;--hover:#222225;--acc:#8ea2ff;--accbg:#1f2540;--onacc:#10131f;
  --ok:#5fbf85;--warn:#e8b85a;--warnbg:#3a2e12;--bad:#ef7a6b;--badbg:#3a1d1a}}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--ink);padding:0 16px 24px;max-width:1180px}
@media(max-width:599px){body{padding:0 10px 20px}}
</style>
<div id="hq"><noscript>The hub page needs JavaScript.</noscript></div>
<script src="/board.js"></script>
<script>
// the hub page: polls /api/state (2 s) and /api/tickets (15 s); posts JSON to /api/answer, /api/send, /api/unsend,
// the queue's writes (/api/queue/set, /api/queue/move, /api/queue/pause, /api/queue/agent, /api/queue/item_agent,
// /api/queue/options, /api/queue/job) and /api/agents/scan; sbhub_board.js draws
const clock=ms=>new Date(ms).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
let S=null,T=null,okAt=0,downSince=0,last='',lastAt=0,tBusy=false;
async function post(path,body){
  try{const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(r.ok)return null;const j=await r.json().catch(()=>({}));return j.error||'the hub said '+r.status}
  catch(e){return 'hub not reachable'}}
// a queue write: the hub's answer as it is; a stale one (409) carries the current queue
async function queue(path,body){
  try{const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));
    if(r.status===409&&j.stale)return j;
    return r.ok?j:{ok:false,error:j.error||'the hub said '+r.status}}
  catch(e){return {ok:false,error:'hub not reachable'}}}
const board=SBBoard(document.getElementById('hq'),{page:true,
  answer:(qid,answer)=>post('/api/answer',{qid,answer}),
  send:(to,text)=>post('/api/send',{to,text}),
  unsend:id=>post('/api/unsend',{id}),
  queue,
  changed:withTickets=>{tick(true);if(withTickets)tickets()}});
function draw(){
  const down=downSince?(okAt?`Hub not reachable — showing the last state from ${clock(okAt)}`:'Hub not reachable — no state yet'):'';
  const alerts=board.render(S||{agents:{},now:Date.now()/1000},{down,live:[!downSince,downSince?'offline':'live'],tickets:T});
  document.title=(alerts?`(${alerts}) `:'')+'sb hub'}
async function tick(force){
  let s;
  try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw new Error(r.status);s=await r.json()}
  catch(e){if(!downSince){downSince=Date.now();draw()}return}
  if(downSince){downSince=0;force=true}
  S=s;okAt=Date.now();const {now,...rest}=s,key=JSON.stringify(rest);
  if(force!==true&&key===last&&Date.now()-lastAt<10000)return;
  last=key;lastAt=Date.now();draw()}
// the open tickets: slow (the hub reads every map through sbmap, cached 15 s), so on their own clock
async function tickets(){
  if(tBusy||downSince)return;tBusy=true;
  try{const r=await fetch('/api/tickets',{cache:'no-store'});if(r.ok){const t=await r.json();
    if(Array.isArray(t)&&JSON.stringify(t)!==JSON.stringify(T)){T=t;if(S)draw()}}}
  catch(e){}
  tBusy=false}
tick();tickets();setInterval(tick,2000);setInterval(tickets,15000);
</script>
